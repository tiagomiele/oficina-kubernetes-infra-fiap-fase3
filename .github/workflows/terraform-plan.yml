name: Terraform plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: HCP Terraform workspace environment
        required: true
        default: homolog
        type: choice
        options:
          - homolog
          - production
      stack:
        description: Configuração a planejar
        required: true
        default: infrastructure
        type: choice
        options:
          - infrastructure
          - observability

permissions:
  contents: read

jobs:
  plan:
    name: Plan ${{ inputs.stack }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: >-
        ${{ inputs.stack == 'observability'
        && (inputs.environment == 'homolog' && vars.TF_WORKSPACE_OBSERVABILITY_HOMOLOG || vars.TF_WORKSPACE_OBSERVABILITY_PRODUCTION)
        || (inputs.environment == 'homolog' && vars.TF_WORKSPACE_HOMOLOG || vars.TF_WORKSPACE_PRODUCTION) }}
      WORKING_DIRECTORY: ${{ inputs.stack == 'observability' && 'observability/newrelic' || '.' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Validate HCP configuration
        run: |
          test -n "$TF_CLOUD_ORGANIZATION"
          test -n "$TF_WORKSPACE"

      # As credenciais só existem no GitHub Environment quando o operador as
      # cadastra; no HCP Terraform elas ficam no próprio workspace.
      - name: Validate AWS session
        if: inputs.stack == 'infrastructure' && secrets.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
        run: ./scripts/check-aws-session.sh

      - name: Terraform init
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform plan -input=false -no-color

      - name: Summary
        run: |
          {
            echo "## Plan"
            echo
            echo "- stack: ${{ inputs.stack }}"
            echo "- ambiente: ${{ inputs.environment }}"
            echo "- workspace: ${TF_WORKSPACE}"
            echo "- nenhum apply executado"
          } >> "$GITHUB_STEP_SUMMARY"
